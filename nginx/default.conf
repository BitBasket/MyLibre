# Public TLS belongs here (listen 443 ssl + Let's Encrypt, or Caddy in front).
# Do not proxy /api/ to the poller's AUTH_LISTEN socket. The PHP API on 8765
# handles /api/keys and forwards /api/librelink/ to AUTH_LISTEN (127.0.0.1:8766).
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Plaintext snapshots are never served — only the .asc ciphertext is.
    # This must precede the .json(.asc) locations so a stale cleartext file
    # left by an older deployment cannot be fetched.
    location ~* '^/(current|status|history|history-[0-9]{8}|b/[0-9]+)\.json$' {
        return 404;
    }

    location ~* '^/(current|history-[0-9]{8}|status)\.json(\.asc)?$' {
        default_type text/plain;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~* '^/b/[0-9]+\.json(\.asc)?$' {
        default_type text/plain;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type $http_content_type;
        proxy_pass_request_body on;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
