<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07131a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Libre Glucose</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="stylesheet" href="/app.css">
</head>
<body class="locked">
    <section id="unlock-gate" class="unlock-gate" aria-labelledby="unlock-title">
        <form id="unlock-form" class="unlock-card">
            <h1 id="unlock-title">Unlock glucose history</h1>
            <p class="muted">Use the same GnuPG keypair the poller encrypts with (<code>data/keys/public.asc</code> and <code>data/keys/private.asc</code>).</p>
            <div id="key-fields">
                <label for="public-key-file">Public key</label>
                <input id="public-key-file" type="file" accept=".asc,.txt,.gpg,.pgp,text/plain">
                <textarea id="public-key" rows="6" placeholder="-----BEGIN PGP PUBLIC KEY BLOCK-----" spellcheck="false" autocomplete="off"></textarea>
                <label for="private-key-file">Private key</label>
                <input id="private-key-file" type="file" accept=".asc,.txt,.gpg,.pgp,text/plain">
                <textarea id="private-key" rows="6" placeholder="-----BEGIN PGP PRIVATE KEY BLOCK-----" spellcheck="false" autocomplete="off"></textarea>
            </div>
            <label for="pgp-passphrase">Passphrase</label>
            <input id="pgp-passphrase" type="password" autocomplete="current-password" required>
            <p id="unlock-error" class="unlock-error hidden" role="alert"></p>
            <button type="submit" id="unlock-btn">Unlock</button>
            <button type="button" id="forget-keys" class="secondary hidden">Forget saved keys</button>
        </form>
    </section>
    <main class="shell">
        <header class="top">
            <div>
                <h1>Glucose</h1>
                <p id="source-line" class="muted">encrypted local snapshot</p>
            </div>
            <button type="button" id="lock-btn" class="lock-btn">Lock</button>
        </header>

        <section id="banner" class="banner hidden" role="status"></section>

        <section class="current" aria-live="polite">
            <p id="value" class="value">--</p>
            <p class="unit">mg/dL</p>
            <p id="arrow" class="arrow"></p>
            <p id="trend" class="trend"></p>
            <p id="age" class="age">waiting for a reading</p>
        </section>

        <nav class="ranges" aria-label="History range">
            <button type="button" data-hours="3" class="active">3h</button>
            <button type="button" data-hours="6">6h</button>
            <button type="button" data-hours="12">12h</button>
            <button type="button" data-hours="24">24h</button>
            <button type="button" data-hours="168">7d</button>
            <button type="button" data-hours="all">All</button>
        </nav>

        <section class="chart-wrap">
            <div class="chart-toolbar">
                <p id="chart-window" class="chart-window">last 3 hours</p>
                <p id="chart-stats" class="chart-stats"></p>
            </div>
            <div class="chart-main">
                <canvas id="chart" aria-label="Glucose history chart"></canvas>
                <div id="chart-tooltip" class="chart-tooltip hidden" role="tooltip"></div>
            </div>
            <div class="chart-overview-wrap">
                <canvas id="chart-overview" aria-label="Full glucose history navigator"></canvas>
            </div>
            <p class="chart-hint">Hover any minute · scroll to zoom · drag to pan · drag the window to scrub all history</p>
        </section>
    </main>
    <script src="/vendor/chart.umd.min.js"></script>
    <script src="/vendor/openpgp.min.js"></script>
    <script src="/pgp.js"></script>
    <script src="/app.js"></script>
</body>
</html>
